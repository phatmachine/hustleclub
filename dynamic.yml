http:
  routers:
    app-router:
      rule: "Host(`hustleclub.app`) || Host(`www.hustleclub.app`)"
      service: app-service
      entryPoints:
        - "websecure"
      tls:
        certResolver: letsencrypt
  services:
    app-service:
      loadBalancer:
        servers:
          - url: "http://hustleclub-app:3000"