<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HustleClub - Domain Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>HustleClub Domain Test</h1>
    <p class="success">✓ Domain hustleclub.app is correctly routed to this container!</p>
    <p>Container: hustleclub</p>
    <p>Port: 3001 (external) → 3000 (internal)</p>
    <p>HTTPS: Secured via Traefik with Let's Encrypt</p>
    <p>Timestamp: <span id="timestamp"></span></p>
    
    <script>
        document.getElementById('timestamp').textContent = new Date().toISOString();
    </script>
</body>
</html>
