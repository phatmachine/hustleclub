services:
  hustleclub:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    # app listens on 3000 inside the container
    expose:
      - "3000"
    volumes:
      - ./logs:/app/logs
      # The SQLite session store. Without this line a rebuild wipes
      # every recall code that has ever been issued.
      - ./data:/app/data
    networks:
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.hustleclub.rule=Host(`hustleclub.app`) || Host(`www.hustleclub.app`)
      - traefik.http.routers.hustleclub.entrypoints=websecure
      - traefik.http.routers.hustleclub.tls=true
      - traefik.http.services.hustleclub.loadbalancer.server.port=3000

networks:
  traefik-proxy:
    external: true