version: '3.8'

services:
  control:
    build:
      context: .
      dockerfile: Dockerfile.control
    container_name: hustleclub-control
    restart: unless-stopped
    ports:
      - "3002:3002"
    # ADMIN_PASSWORD lives in .env (git-ignored), same as every other
    # secret in this project — never hardcode it here. The server
    # refuses to start without it; see control-server.js.
    env_file:
      - .env
    environment:
      - ADMIN_PORT=3002
    # Dockerfile.control already COPYs the whole repo in at build time,
    # so control.html/control-server.js/stress_test_no_limits.py don't
    # need a runtime bind mount — and on deploy hosts that build from a
    # throwaway clone rather than keeping a live checkout in the project
    # directory, those file-level mounts have nothing to point at, which
    # fails the whole container ("not a directory" mount errors).
    #
    # logs/ is an absolute path, not ./logs: this service deploys as its
    # own Compose project, in its own directory, separate from the main
    # hustleclub app's. A relative ./logs would mount an empty folder of
    # its own instead of the usage.log the main app actually writes. It
    # has to point at that app's real logs directory on the host.
    volumes:
      - /home/hustleclub/logs:/app/logs:ro
    networks:
      - traefik-proxy
    labels:
      - traefik.enable=true
      # Deliberately not "admin" anywhere here — the router/service names
      # and the hostname are what an operator sees in the Traefik
      # dashboard and what a scanner tries first, respectively.
      - traefik.http.routers.hustleclub-control.rule=Host(`control.hustleclub.app`)
      - traefik.http.routers.hustleclub-control.entrypoints=websecure
      - traefik.http.routers.hustleclub-control.tls.certresolver=letsencrypt
      - traefik.http.services.hustleclub-control.loadbalancer.server.port=3002

networks:
  traefik-proxy:
    external: true
